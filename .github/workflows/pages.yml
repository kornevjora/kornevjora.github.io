name: Publish guides
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify and unpack public release
        run: |
          sha256sum --strict --check SHA256SUMS
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path('public').resolve()
          root.mkdir()
          seen = set()
          names = [line.split()[1] for line in pathlib.Path('SHA256SUMS').read_text().splitlines()]
          for name in names:
              with zipfile.ZipFile(name) as archive:
                  for item in archive.infolist():
                      path = pathlib.PurePosixPath(item.filename)
                      if path.is_absolute() or '..' in path.parts or any(p.startswith('.') for p in path.parts):
                          raise ValueError('Unsafe public path')
                      if item.filename in seen or (item.external_attr >> 16) & 0o170000 == 0o120000:
                          raise ValueError('Duplicate path or symbolic link')
                      seen.add(item.filename)
                      archive.extract(item, root)
          assert (root / 'index.html').is_file()
          assert (root / 'robots.txt').is_file()
          assert 'Disallow: /\n' not in (root / 'robots.txt').read_text()
          PY
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
